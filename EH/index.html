  <style>

    .tab-btn.active { background: var(--accent); color:#fff; }

    main.wrap { padding: 22px 16px 48px; }

    .answer-book li { margin:.33rem 0; }

      white-space: pre-wrap; background:#fcf9f4; border:1px solid var(--border); padding:12px; border-radius:10px; overflow:auto;
    }
    .math-inline {

    }

    .mfrac { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.1; margin:0 .1em; }

    .msqrt .rad { border-top:1px solid currentColor; padding:.05em .1em 0; }
    .mtext { font-style:normal; font-family: Outfit, system-ui, sans-serif; }
    .moverline { text-decoration: overline; }
    .related-inline { margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }
    .related-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:8px; margin-top:8px; }
    .related-btn { text-align:left; border:1px solid var(--border); background:#fdfbfa; border-radius:10px; padding:10px; cursor:pointer; }
    .related-btn:hover { border-color: var(--accent); color: var(--accent); }
    .zoom-xs { font-size:.8rem !important; }
    .zoom-sm { font-size:.92rem !important; }
    .zoom-base { font-size:1rem !important; }

    @media (max-width: 768px) {

      .modal-answer { padding: 12px; }
      .head-row { align-items: stretch; }
    }

  <script>
    const questionsDB = [
      {
        id: 'pyq-2022-2-a', module: 2, year: 2022, marks: 8, diff: 'Medium', qtype: 'Theory', importance: 'High', repeated: true, probable: true,
        concept: 'Forms of precipitation & missing precipitation estimation', formula: 'P_x = (N_x/M) \\sum (P_i/N_i)', qnum: 'Q2 (a)',
        question: 'Explain the different forms of precipitation. How is missing annual precipitation at a station estimated?',
        answer: `
          <h4>Forms of Precipitation</h4>
          <ul>
            <li><b>Rain:</b> Liquid drops with diameter generally between $0.5\\text{ mm}$ and $6\\text{ mm}$.</li>
            <li><b>Drizzle:</b> Very fine drops, usually less than $0.5\\text{ mm}$.</li>
            <li><b>Snow:</b> Ice crystals formed directly from vapour at sub-zero temperatures.</li>
            <li><b>Sleet:</b> Frozen raindrops or ice pellets formed when rain passes through a cold layer.</li>
            <li><b>Glaze:</b> Freezing rain that forms a smooth coating of ice on contact surfaces.</li>
            <li><b>Hail:</b> Lumps of ice formed due to repeated updrafts in thunderstorm clouds.</li>
          </ul>
          <h4>Estimation of Missing Annual Precipitation</h4>
          <p>If the normal annual rainfalls of neighboring stations differ by less than about $10\%$, the arithmetic mean method is used:</p>
          $$P_x = \frac{P_1 + P_2 + P_3 + \cdots + P_n}{n}$$
          <p>If the normal annual rainfall differs significantly, the <b>Normal Ratio Method</b> is preferred:</p>
          $$P_x = \frac{N_x}{n}\left(\frac{P_1}{N_1} + \frac{P_2}{N_2} + \cdots + \frac{P_n}{N_n}\right)$$
          <div class="note-box"><b>📝 Notation & Units:</b> $P_x$ = missing rainfall at station $x$; $N_x$ = normal annual rainfall at station $x$; $P_i$ = annual rainfall at neighboring station $i$; $N_i$ = normal annual rainfall at station $i$; $n$ = number of neighboring stations.</div>
          <div class="summary-box">📌 <b>Summary:</b> Use arithmetic mean for uniform normal rainfall conditions and normal ratio method when station normals vary appreciably.</div>
          <div class="note-box">💡 <b>Approach:</b> In theory answers, first classify precipitation, then separately write the two estimation methods with conditions of applicability.</div>
        `
      },
      {
        id: 'pyq-2022-3-b', module: 3, year: 2022, marks: 7, diff: 'Hard', qtype: 'Numerical', importance: 'High', repeated: true, probable: true,
        concept: 'Phi-index numerical calculation', formula: 'R = \\sum(P_i - \\Phi)\\Delta t', qnum: 'Q3 (b)',
        question: 'The average rainfall over 55 hectares of watershed for a particular storm was as follows: Time (hr): 0, 1, 2, 3, 4, 5, 6, 7. Rainfall (cm): 0, 0.75, 1.25, 3.40, 2.95, 1.40, 0.80, 0. The volume of runoff from the storm was determined as 3.20 ha-m. Establish the $\\Phi$-index.',
        answer: `
          <h4>Step 1: Runoff Depth</h4>
          $$R = \frac{3.20\text{ ha-m}}{55\text{ ha}} = 0.05818\text{ m} = 5.818\text{ cm}$$
          <h4>Step 2: Total Rainfall</h4>
          <p>The rainfall over the six active periods is:</p>
          $$P = 0.75 + 1.25 + 3.40 + 2.95 + 1.40 + 0.80 = 10.55\text{ cm}$$
          <h4>Step 3: Trial for $\Phi$-index</h4>
          <p>First trial with all 6 hours active:</p>
          $$\Phi = \frac{10.55 - 5.818}{6} = 0.789\text{ cm/hr}$$
          <p>But the first rainfall block is only $0.75\text{ cm}$, which is less than $0.789\text{ cm/hr}$ and hence excluded.</p>
          <p>Using the remaining 5 active hours:</p>
          $$\Phi = \frac{9.80 - 5.818}{5} = 0.796\text{ cm/hr}$$
          <p>Hence,</p>
          $$\boxed{\Phi = 0.796\text{ cm/hr}}$$
          <div class="note-box"><b>📝 Notation & Units:</b> $R$ = runoff depth (cm); $P$ = total rainfall depth (cm); $\Phi$ = infiltration index (cm/hr); $1\text{ ha-m}$ = hectare-meter.</div>
          <div class="summary-box">📌 <b>Summary:</b> The rainfall block lower than the trial infiltration index is excluded, giving the correct final value $\Phi = 0.796\text{ cm/hr}$.</div>
          <div class="note-box">💡 <b>Approach:</b> Always test the trial $\Phi$ against each rainfall block. If any block is smaller than the trial value, exclude it and recompute.</div>
        `
      },
      {
        id: 'pyq-2022-4-b', module: 6, year: 2022, marks: 4, diff: 'Easy', qtype: 'Theory', importance: 'High', repeated: true, probable: true,
        concept: 'S-curve and uses', formula: 'S(t) = U(t)+U(t-D)+U(t-2D)+\\cdots', qnum: 'Q4 (b)',
        question: 'What is S-curve? Explain its uses.',
        answer: `
          <h4>Definition</h4>
          <p>The <b>S-curve</b> or <b>summation hydrograph</b> is obtained by successively superimposing unit hydrographs of duration $D$ lagged by $D$ hours:</p>
          $$S(t) = U(t) + U(t-D) + U(t-2D) + \cdots$$
          <p>It gradually approaches an equilibrium discharge under a continuous sequence of unit storms.</p>
          <h4>Main Uses</h4>
          <ol>
            <li>To derive a unit hydrograph of duration different from the given duration.</li>
            <li>To obtain smaller-duration or larger-duration unit hydrographs.</li>
            <li>To conceptually approach the instantaneous unit hydrograph.</li>
          </ol>
          <p>The equilibrium discharge for a catchment of area $A$ and duration $D$ is:</p>
          $$Q_e = 2.778\frac{A}{D}$$
          <div class="note-box"><b>📝 Notation & Units:</b> $S(t)$ = S-curve ordinate; $U(t)$ = unit hydrograph ordinate; $A$ = area in $\text{km}^2$; $D$ = duration in hours; $Q_e$ = equilibrium discharge in $\text{m}^3/\text{s}$.</div>
          <div class="summary-box">📌 <b>Summary:</b> The S-curve is a powerful transformation tool for unit hydrograph duration conversion.</div>
          <div class="note-box">💡 <b>Approach:</b> In book-style answers, first define the S-curve, then state the formula, and finally list 2–3 practical uses in points.</div>
        `
      },
      {
        id: 'pyq-2022-5-b', module: 6, year: 2022, marks: 7, diff: 'Hard', qtype: 'Numerical', importance: 'High', repeated: true, probable: true,
        concept: 'Snyder synthetic unit hydrograph', formula: 't_p=C_t(LL_{ca})^{0.3}', qnum: 'Q5 (b)',
        question: 'Explain Synthetic unit hydrograph. A basin has 560 sq.km of area, $L=30\text{ km}$, $L_{ca}=18\text{ km}$. Assuming $C_t=1.30$, $C_p=0.70$, develop a 3-hr Synthetic unit hydrograph for the basin using Snyder\'s method.',
        answer: `
          <h4>Step 1: Basin Lag</h4>
          $$t_p = C_t(LL_{ca})^{0.3} = 1.30(30\times 18)^{0.3} = 8.58\text{ hr}$$
          <h4>Step 2: Standard Duration</h4>
          $$t_r = \frac{t_p}{5.5} = \frac{8.58}{5.5} = 1.56\text{ hr}$$
          <h4>Step 3: Adjusted Lag for 3-hr UH</h4>
          $$t_p' = t_p + 0.25(t_R - t_r) = 8.58 + 0.25(3 - 1.56) = 8.94\text{ hr}$$
          <h4>Step 4: Peak Discharge</h4>
          $$Q_p = \frac{2.78C_pA}{t_p'} = \frac{2.78\times 0.70\times 560}{8.94} = 121.9\text{ m}^3/\text{s}$$
          <h4>Step 5: Base Time</h4>
          $$T_b = 5\left(t_p' + \frac{t_R}{2}\right) = 5(8.94 + 1.5) = 52.2\text{ hr}$$
          <div class="note-box"><b>📝 Notation & Units:</b> $L$ = main stream length (km); $L_{ca}$ = distance to centroid (km); $t_p$ = basin lag (hr); $t_R$ = required rainfall duration (hr); $Q_p$ = peak discharge.</div>
          <div class="summary-box">📌 <b>Summary:</b> The 3-hr Snyder synthetic UH has adjusted lag $8.94\text{ hr}$ and peak discharge $121.9\text{ m}^3/\text{s}$.</div>
          <div class="note-box">💡 <b>Approach:</b> Always compute the standard lag first, then adjust it for the required storm duration before calculating the peak.</div>
        `
      },
      {
        id: 'pyq-2022-6-b', module: 7, year: 2022, marks: 8, diff: 'Hard', qtype: 'Numerical', importance: 'High', repeated: true, probable: true,
        concept: 'Gumbel flood frequency analysis', formula: 'X_T = \\bar{X} + KS', qnum: 'Q6 (b)',
        question: 'The observed annual flood peaks for a river are given for 15 years. Estimate the peak flood of 100 years return period by Gumbel\'s method.',
        answer: `
          <h4>Gumbel Formula</h4>
          $$X_T = \bar{X} + KS$$
          <p>For the given 15-year flood series,</p>
          $$\bar{X} = 3022.07\text{ m}^3/\text{s}, \qquad S = 878.83\text{ m}^3/\text{s}$$
          <p>For $N=15$, the reduced mean and reduced standard deviation are taken as:</p>
          $$Y_n = 0.5128, \qquad S_n = 1.0206$$
          <p>For $T=100$ years, the reduced variate is:</p>
          $$y_T = -\ln\left[-\ln\left(1-\frac{1}{100}\right)\right] = 4.60015$$
          <p>Therefore,</p>
          $$K = \frac{y_T - Y_n}{S_n} = \frac{4.60015 - 0.5128}{1.0206} = 4.00485$$
          <p>Hence, the 100-year flood is:</p>
          $$X_{100} = 3022.07 + 4.00485\times 878.83 = 6541.66\text{ m}^3/\text{s}$$
          $$\boxed{X_{100} = 6541.66\text{ m}^3/\text{s}}$$
          <div class="note-box"><b>📝 Notation & Units:</b> $X_T$ = flood magnitude for return period $T$; $\bar{X}$ = sample mean; $S$ = standard deviation; $K$ = frequency factor; $y_T$ = reduced variate.</div>
          <div class="summary-box">📌 <b>Summary:</b> Gumbel’s method transforms return period into a reduced variate and then estimates flood using frequency factor $K$.</div>
          <div class="note-box">💡 <b>Approach:</b> Write all five steps clearly: mean, standard deviation, reduced variate, frequency factor, and final flood estimate.</div>
        `
      },

      function latexToHtml(input){
        let s = String(input || '').trim();
        s = s.replace(/\\left/g,'').replace(/\\right/g,'').replace(/\\,/g,' ').replace(/~/g,' ');

        function recurse(x){ return latexToHtml(x); }

        let prev;
        do {
          prev = s;
          s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, (_, a, b) => `<span class="mfrac"><span class="num">${recurse(a)}</span><span class="den">${recurse(b)}</span></span>`);
          s = s.replace(/\\sqrt\{([^{}]*)\}/g, (_, a) => `<span class="msqrt"><span class="root">√</span><span class="rad">${recurse(a)}</span></span>`);
          s = s.replace(/\\text\{([^{}]*)\}/g, (_, a) => `<span class="mtext">${escapeHtml(a)}</span>`);
          s = s.replace(/\\bar\{([^{}]*)\}/g, (_, a) => `<span class="moverline">${recurse(a)}</span>`);
        } while (s !== prev);

        const map = {
          '\\cdot':'·','\\times':'×','\\approx':'≈','\\ge':'≥','\\le':'≤','\\pm':'±','\\implies':'⇒','\\to':'→',
          '\\sum':'∑','\\Delta':'Δ','\\Phi':'Φ','\\phi':'φ','\\alpha':'α','\\beta':'β','\\theta':'θ','\\mu':'μ','\\sigma':'σ',
          '\\ln':'ln','\\quad':' '
        };
        Object.keys(map).forEach(k=>{ s = s.split(k).join(map[k]); });

        s = s.replace(/([A-Za-z0-9)\]ΦφΔΣμσ])\^\{([^{}]+)\}/g, (_, a, b) => `${a}<sup>${recurse(b)}</sup>`);
        s = s.replace(/([A-Za-z0-9)\]ΦφΔΣμσ])\^([A-Za-z0-9+\-.]+)/g, (_, a, b) => `${a}<sup>${escapeHtml(b)}</sup>`);
        s = s.replace(/([A-Za-z0-9)\]ΦφΔΣμσ])_\{([^{}]+)\}/g, (_, a, b) => `${a}<sub>${recurse(b)}</sub>`);
        s = s.replace(/([A-Za-z0-9)\]ΦφΔΣμσ])_([A-Za-z0-9]+)/g, (_, a, b) => `${a}<sub>${escapeHtml(b)}</sub>`);
        return s;
      }

      function renderMath(root=document.body){
        const ignored = new Set(['SCRIPT','STYLE','TEXTAREA','PRE','CODE']);
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(node){
            const p = node.parentElement;
            if (!p || ignored.has(p.tagName)) return NodeFilter.FILTER_REJECT;
            if (p.closest('[data-math-rendered="1"]')) return NodeFilter.FILTER_REJECT;
            return node.nodeValue && node.nodeValue.includes('$') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
          }
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node=>{
          const src = node.nodeValue;
          const frag = document.createDocumentFragment();
          let idx = 0;
          const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
          let m, has=false;
          while((m = re.exec(src)) !== null){
            has=true;
            if(m.index > idx) frag.appendChild(document.createTextNode(src.slice(idx, m.index)));
            const el = document.createElement(m[1] ? 'div' : 'span');
            el.dataset.mathRendered = '1';
            el.className = m[1] ? 'math-display' : 'math-inline';
            el.innerHTML = latexToHtml((m[1] || m[2] || '').trim());
            frag.appendChild(el);
            idx = re.lastIndex;
          }
          if(!has) return;
          if(idx < src.length) frag.appendChild(document.createTextNode(src.slice(idx)));
          node.parentNode.replaceChild(frag, node);
        });
      }

        $('#fModule').onchange = e => { filters.module = e.target.value; renderPyqBank(); };
        $('#fYear').onchange = e => { filters.year = e.target.value; renderPyqBank(); };
        $('#fDiff').onchange = e => { filters.diff = e.target.value; renderPyqBank(); };
        $('#fType').onchange = e => { filters.type = e.target.value; renderPyqBank(); };
        $('#fSort').onchange = e => { filters.sort = e.target.value; renderPyqBank(); };
        $('#cRep').onchange = e => { filters.repeated = e.target.checked; renderPyqBank(); };
        $('#cImp').onchange = e => { filters.important = e.target.checked; renderPyqBank(); };
        $('#cProb').onchange = e => { filters.probable = e.target.checked; renderPyqBank(); };
        $('#cCon').onchange = e => { filters.conceptual = e.target.checked; renderPyqBank(); };
        $('#cFor').onchange = e => { filters.formula = e.target.checked; renderPyqBank(); };
        $('#resetFilters').onclick = ()=>{ filters = {search:'', module:'all', year:'all', diff:'all', type:'all', repeated:false, important:false, probable:false, conceptual:false, formula:false, sort:'year-desc'}; renderPyqBank(); };
        $$('.open-answer', $('#pyq-bank')).forEach(btn=>btn.onclick = ()=>openModal(btn.dataset.id));
        renderMath($('#pyq-bank'));
      }

      function renderSyllabus(){
        const groups = {must:'🔴 MUST STUDY', study:'🟡 STUDY', skim:'🟢 SKIM', skip:'⚪ SKIP'};
        const total = syllabusTopics.length;
        const done = syllabusTopics.filter(t=>syllabusStore[t.id]).length;
        updateProgress(done, total);
        $('#syllabus').innerHTML = `
          <div class="hero-card"><h2>🎯 Smart Syllabus</h2><p>Interactive local checklist for revision tracking.</p></div>
          <div class="grid grid-3">
            ${Object.entries(groups).map(([key,label])=>`
              <div class="card">
                <h3 style="margin-bottom:10px;color:${key==='must'?'var(--red)':key==='study'?'#d97706':key==='skim'?'#16a34a':'#64748b'};">${label}</h3>
                ${(syllabusTopics.filter(t=>t.cat===key).map(t=>`
                  <label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer;">
                    <input type="checkbox" data-syllabus="${t.id}" ${syllabusStore[t.id]?'checked':''} style="margin-top:4px;accent-color:var(--accent);">
                    <span style="text-decoration:${syllabusStore[t.id]?'line-through':'none'};color:${syllabusStore[t.id]?'#94a3b8':'var(--text)'};">${t.text}</span>
                  </label>
                `).join(''))}
              </div>
            `).join('')}
          </div>
        `;
        $$('[data-syllabus]').forEach(input=>input.onchange = e=>{
          syllabusStore[e.target.dataset.syllabus] = e.target.checked;
          localStorage.setItem('EH_syllabus', JSON.stringify(syllabusStore));
          renderSyllabus();
        });
      }

      function updateProgress(done,total){
        const pct = total?Math.round(done/total*100):0;
        $('#progressText').textContent = `${done}/${total} (${pct}%)`;
        $('#progressFill').style.width = `${pct}%`;
      }

      function openModal(id){
        const q = questionsDB.find(x=>x.id===id);
        if(!q) return;
        selectedQuestion = q;
        $('#modalBadges').innerHTML = `${badge(q.year,'b-year')}${badge(q.marks+' marks','b-marks')}${badge('Module '+q.module,'b-module')}${diffBadge(q.diff)}`;
        $('#modalQnum').textContent = q.qnum;
        $('#modalQuestion').innerHTML = q.question;
        $('#modalAnswer').innerHTML = `<article class="answer-book">${q.answer}${buildRelatedInline(q)}</article>`;
        $('#modal').classList.add('open');
        currentZoom = 100; setZoom(100);
        renderMath($('#modalAnswer')); renderMath($('#modalQuestion'));
      }

      function buildRelatedInline(q){
        const rel = relatedPyqMap[q.id] || [];
        if(!rel.length) return '';
        return `<div class="related-inline"><h4>Related PYQs</h4><div class="related-grid">${rel.map(id=>{
          const x=questionsDB.find(q=>q.id===id); if(!x) return '';
          return `<button class="related-btn" data-related="${x.id}"><div class="mono" style="font-size:.68rem;font-weight:800;color:var(--accent);margin-bottom:2px;">${x.year} • ${x.qnum}</div><div style="font-size:.82rem;font-weight:700;">${x.concept}</div></button>`;
        }).join('')}</div></div>`;
      }

      function setZoom(v){
        currentZoom = v;
        $('#zoomLabel').textContent = `${v}%`;
        const area = $('#modalAnswer');
        area.classList.remove('zoom-xs','zoom-sm','zoom-base','zoom-lg','zoom-xl','zoom-2xl');
        if(v<=80) area.classList.add('zoom-xs');
        else if(v<=90) area.classList.add('zoom-sm');
        else if(v===100) area.classList.add('zoom-base');
        else if(v<=120) area.classList.add('zoom-lg');
        else if(v<=140) area.classList.add('zoom-xl');
        else area.classList.add('zoom-2xl');
      }

      function copyText(text, btn){
        navigator.clipboard.writeText(text).then(()=>{
          const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent = old, 1200);
        });
      }

      function renderApp(){
        renderTabs();
        renderPriority();
        renderFrequency();
        renderStrategy();
        renderTimetable();
        renderPyqBank();
        renderSyllabus();
        renderMath(document.body);
      }

      $('#closeModal').onclick = ()=>$('#modal').classList.remove('open');
      $('#doneModal').onclick = ()=>$('#modal').classList.remove('open');
      $('#zoomOut').onclick = ()=>setZoom(Math.max(70, currentZoom-10));
      $('#zoomIn').onclick = ()=>setZoom(Math.min(180, currentZoom+10));
      $('#zoomReset').onclick = ()=>setZoom(100);
      $('#copyQuestion').onclick = ()=> selectedQuestion && copyText($('#modalQuestion').innerText, $('#copyQuestion'));
      $('#copyAnswer').onclick = ()=> selectedQuestion && copyText($('#modalAnswer').innerText, $('#copyAnswer'));
      $('#modalAnswer').addEventListener('click', e=>{
        const btn = e.target.closest('[data-related]');
        if(btn) openModal(btn.dataset.related);
      });
      $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); });

      renderApp();
    })();
  </script>
</body>
</html>
